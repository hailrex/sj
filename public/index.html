		<script>
			// Client-side lock (casual protection, same idea as the arcade's pw.js):
			// salted SHA-256 of the lowercased password; remembered for the session.
			(function () {
				var HASH = "43737e3e51eed2b2eeefc8c32ad22ef2a7a2243365c59cdc2f2ff1aa310965bb";
				var KEY = "sj-auth";
				function sha(s) {
					return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (b) {
						return Array.from(new Uint8Array(b)).map(function (x) {
							return x.toString(16).padStart(2, "0");
						}).join("");
					});
				}
				function already() {
					try { return sessionStorage.getItem(KEY) === HASH || localStorage.getItem(KEY) === HASH; }
					catch (e) { return false; }
				}
				if (already()) return;
				document.body.classList.add("gated");
				var input = document.getElementById("gate-input");
				var msg = document.getElementById("gate-msg");
				document.getElementById("gate-form").addEventListener("submit", function (e) {
					e.preventDefault();
					var v = input.value.trim().toLowerCase();
					sha("sj:" + v).then(function (h) {
						if (h === HASH) {
							try { sessionStorage.setItem(KEY, HASH); } catch (err) { /* ignore */ }
							document.body.classList.remove("gated");
						} else {
							msg.textContent = v ? "Wrong password. Try again." : "Enter the password first.";
							input.select();
						}
					});
				});
				setTimeout(function () { input.focus(); }, 60);
			})();
